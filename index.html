<script type="module">
/* =====================================================================
   CONFIGURATION FIREBASE
   Collez ici la configuration de votre projet (Console Firebase >
   Paramètres du projet > Vos applications > Config). Tant que apiKey
   est vide, l'application tourne en MODE DÉMO (données sur l'appareil).
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDOZWVNsHPcMv3eG2IKoip5mhIznXpnzhM",
  authDomain: "collegeaucinema-29bf0.firebaseapp.com",
  projectId: "collegeaucinema-29bf0",
  storageBucket: "collegeaucinema-29bf0.firebasestorage.app",
  messagingSenderId: "650116073083",
  appId: "1:650116073083:web:5bd73480ce36d85fe244de"
};
const DEMO = !FIREBASE_CONFIG.apiKey;

/* --------- Valeurs par défaut (modifiables ensuite dans Réglages) --------- */
const DEFAULT_SETTINGS = {
  referent: "Emile",
  note20: { base: 15, coef: 1 },
  sorties: [
    { id: "s1", titre: "Flow", date: "2026-11-30" },
    { id: "s2", titre: "Le petit fugitif", date: "2027-02-01" },
    { id: "s3", titre: "Moonrise Kingdom", date: "2027-05-31" }
  ],
  actions: [
    { id: "b1", type: "+", label: "Comportement exemplaire", pts: 2 },
    { id: "b2", type: "+", label: "Très attentif pendant le film", pts: 1 },
    { id: "b3", type: "+", label: "Poli et respectueux", pts: 1 },
    { id: "b4", type: "+", label: "Reste groupé, sérieux sur le trajet", pts: 1 },
    { id: "b5", type: "+", label: "Aide un camarade", pts: 1 },
    { id: "b6", type: "+", label: "Participe au débat après le film", pts: 1 },
    { id: "m1", type: "-", label: "Bavardage pendant la séance", pts: 1 },
    { id: "m2", type: "-", label: "Sort son téléphone", pts: 2 },
    { id: "m3", type: "-", label: "Mange / boit / chewing-gum", pts: 1 },
    { id: "m4", type: "-", label: "Pieds sur les fauteuils", pts: 1 },
    { id: "m5", type: "-", label: "Se lève sans autorisation", pts: 1 },
    { id: "m6", type: "-", label: "Ne reste pas groupé / traverse seul", pts: 2 },
    { id: "m7", type: "-", label: "Impolitesse, manque de respect", pts: 2 },
    { id: "m8", type: "-", label: "Ne respecte pas le placement", pts: 1 }
  ]
};
const CHECKPOINTS = [["aller", "🚶 Aller"], ["cinema", "🎬 Salle"], ["retour", "🏫 Retour"]];

/* ----------------------------- utilitaires ----------------------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase();
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const uid8 = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sgn = n => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n);
const cls = n => (n > 0 ? "pos" : n < 0 ? "neg" : "zer");
const hm = ts => new Date(ts).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
const fmtD = d => d ? new Date(d + "T12:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) : "";
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const clone = o => JSON.parse(JSON.stringify(o));

/* ------------------------------ stockage -------------------------------
   Même interface pour le mode démo (localStorage) et Firebase :
   watch(collection, cb), add, set (fusion), del                         */
function LocalStore() {
  const mem = {}, subs = {};
  const key = c => "cac_demo_" + c;
  const read = c => { try { return JSON.parse(localStorage.getItem(key(c)) || "{}"); } catch (e) { return mem[c] || {}; } };
  const write = (c, o) => { mem[c] = o; try { localStorage.setItem(key(c), JSON.stringify(o)); } catch (e) {} emit(c); };
  const emit = c => { const o = read(c); const arr = Object.entries(o).map(([id, d]) => ({ id, ...d })); (subs[c] || []).forEach(f => f(arr, false)); };
  addEventListener("storage", e => { if (e.key && e.key.startsWith("cac_demo_")) emit(e.key.slice(9)); });
  let id = LS.get("cac_demo_uid", null); if (!id) { id = "local-" + uid8(); LS.set("cac_demo_uid", id); }
  return {
    uid: id,
    watch(c, f) { (subs[c] = subs[c] || []).push(f); setTimeout(() => emit(c)); },
    async add(c, d) { const i = uid8(); const o = read(c); o[i] = d; write(c, o); return i; },
    async set(c, i, d) { const o = read(c); o[i] = { ...(o[i] || {}), ...d }; write(c, o); },
    async del(c, i) { const o = read(c); delete o[i]; write(c, o); },
    reset() { ["config", "events", "appel", "profs", "classes"].forEach(c => { try { localStorage.removeItem(key(c)); } catch (e) {} delete mem[c]; }); }
  };
}

async function FireStore(code) {
  const B = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [A, AU, F] = await Promise.all([import(B + "firebase-app.js"), import(B + "firebase-auth.js"), import(B + "firebase-firestore.js")]);
  const app = A.initializeApp(FIREBASE_CONFIG);
  const auth = AU.getAuth(app);
  const existing = await new Promise(res => { const un = AU.onAuthStateChanged(auth, u => { un(); res(u); }); });
  const user = existing || (await AU.signInAnonymously(auth)).user;
  let db;
  try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch (e) { db = F.getFirestore(app); }
  const col = c => F.collection(db, "espaces", code, c);
  const fail = e => { console.error(e); toast("⚠️ Erreur d'enregistrement : " + (e.code || e.message)); };
  return {
    uid: user.uid,
    watch(c, f) {
      return F.onSnapshot(col(c), { includeMetadataChanges: false },
        s => f(s.docs.map(d => ({ id: d.id, ...d.data() })), s.metadata.fromCache),
        e => { console.error(e); toast("⚠️ Synchro impossible (" + e.code + "). Vérifiez le code d'équipe."); });
    },
    // pas de "await" sur l'écriture : elle s'affiche tout de suite et part dès que le réseau revient
    async add(c, d) { const r = F.doc(col(c)); F.setDoc(r, d).catch(fail); return r.id; },
    async set(c, i, d) { F.setDoc(F.doc(col(c), i), d, { merge: true }).catch(fail); },
    async del(c, i) { F.deleteDoc(F.doc(col(c), i)).catch(fail); }
  };
}

/* -------------------------------- état --------------------------------- */
const S = {
  me: LS.get("cac_me", null), store: null,
  tab: "noter", classe: LS.get("cac_classe", "6A"), sortieId: null,
  checkpoint: "aller", onlyLeft: false, bilanScope: "sortie", bilanSort: "nom", expanded: null,
  settings: clone(DEFAULT_SETTINGS), classes: {}, events: [], appel: {}, profs: [],
  sheetEleve: null, ready: { config: false, classes: false }, pending: false,
  impC: "", impT: ""
};
const isRef = () => S.me && norm(S.me.prenom) === norm(S.settings.referent);
const sortie = () => S.settings.sorties.find(s => s.id === S.sortieId) || S.settings.sorties[0];
const classList = () => Object.keys(S.classes).sort();
const eleves = cl => S.classes[cl] || [];
const eleveById = id => { for (const cl in S.classes) { const e = S.classes[cl].find(x => x.id === id); if (e) return e; } };
const appelRec = (sid, cp, eid) => S.appel[`${sid}_${cp}_${eid}`];
const canDel = ev => ev.uid === S.me.uid || isRef();
function pickSortie() {
  const today = new Date().toISOString().slice(0, 10);
  const ss = S.settings.sorties;
  return (ss.find(s => s.date >= today) || ss[ss.length - 1]).id;
}
const todayISO = () => new Date().toISOString().slice(0, 10);
const isNote = e => e.kind !== "comment";
/* note sur 20 d'un élève pour une sortie : départ + points × valeur, bornée 0–20 ; null si absent */
function note20(eid, sid) {
  if (appelRec(sid, "aller", eid)?.statut === "absent") return null;
  const n = S.settings.note20 || DEFAULT_SETTINGS.note20;
  const pts = S.events.reduce((a, e) => a + (e.eleveId === eid && e.sortieId === sid && isNote(e) ? e.pts : 0), 0);
  return Math.max(0, Math.min(20, Math.round((n.base + n.coef * pts) * 2) / 2));
}
const sortieFaite = s => s.date <= todayISO() || S.events.some(e => e.sortieId === s.id);
const f20 = v => v == null ? "ABS" : String(v).replace(".", ",");
const c20 = v => v == null ? "mut" : v >= 14 ? "tp" : v < 10 ? "tm" : "";
function moyenne(eid) {
  const v = S.settings.sorties.filter(sortieFaite).map(s => note20(eid, s.id)).filter(x => x != null);
  return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length * 10) / 10 : null;
}
function scoreMap(filter) {
  const m = {};
  for (const e of S.events) {
    if (!filter(e)) continue;
    const r = m[e.eleveId] = m[e.eleveId] || { plus: 0, minus: 0, nP: 0, nM: 0, nC: 0, bySortie: {} };
    if (e.kind === "comment") { r.nC++; continue; }
    if (e.pts > 0) { r.plus += e.pts; r.nP++; } else { r.minus += e.pts; r.nM++; }
    r.bySortie[e.sortieId] = (r.bySortie[e.sortieId] || 0) + e.pts;
  }
  return m;
}

/* ----------------------------- démarrage ------------------------------- */
function hashCode() { const m = location.hash.match(/[#&]k=([^&]+)/); return m ? decodeURIComponent(m[1]) : null; }

async function start() {
  $("#app").innerHTML = `<div class="loading"><div style="font-size:40px">🎬</div>Connexion…</div>`;
  try { S.store = DEMO ? LocalStore() : await FireStore(S.me.code); }
  catch (e) {
    console.error(e);
    $("#app").innerHTML = `<div class="loading"><div style="font-size:40px">📡</div><b>Connexion impossible</b><span class="mut">${esc(e.code || e.message)}<br>À la toute première ouverture, il faut du réseau.</span><button class="btn acc" onclick="location.reload()">Réessayer</button></div>`;
    return;
  }
  S.me.uid = S.store.uid; LS.set("cac_me", S.me);
  if (DEMO) seedDemo();
  S.store.watch("config", (docs, fromCache) => {
    const d = docs.find(x => x.id === "settings");
    if (d) S.settings = { ...clone(DEFAULT_SETTINGS), ...d };
    else if (!fromCache) S.store.set("config", "settings", clone(DEFAULT_SETTINGS));
    if (!S.sortieId || !S.settings.sorties.some(s => s.id === S.sortieId)) { S.sortieId = pickSortie(); presence(); }
    S.ready.config = true; render(); renderSheet();
  });
  S.store.watch("classes", docs => {
    const c = {};
    docs.forEach(d => { c[d.id] = (d.eleves || []).map(e => ({ ...e, classe: d.id })); });
    S.classes = c;
    if (!c[S.classe] && classList().length) S.classe = classList()[0];
    S.ready.classes = true; render();
  });
  S.store.watch("events", docs => { S.events = docs; render(); renderSheet(); });
  S.store.watch("appel", docs => { const m = {}; docs.forEach(d => m[d.id] = d); S.appel = m; render(); });
  S.store.watch("profs", docs => { S.profs = docs; if (S.tab === "reglages") render(); });
}
function presence() { if (S.store && S.sortieId) S.store.set("profs", S.me.uid, { prenom: S.me.prenom, ts: Date.now(), sortieId: S.sortieId }); }

/* ---- Appel ---- */

/* ---- Bilan ---- */
function vBilan() {
  const el = eleves(S.classe); if (!el.length) return noClass();
  const year = S.bilanScope === "annee", ss = S.settings.sorties;
  const f = e => e.classe === S.classe && (year || e.sortieId === S.sortieId);
  const sm = scoreMap(f);
  const evs = S.events.filter(f), notes = evs.filter(isNote);
  const tot = id => { const s = sm[id]; return s ? s.plus + s.minus : 0; };
  let rows = [...el];
  if (S.bilanSort === "pts") rows.sort((a, b) => tot(b.id) - tot(a.id));
  if (S.bilanSort === "neg") rows.sort((a, b) => tot(a.id) - tot(b.id));
  const noteOf = e => year ? moyenne(e.id) : note20(e.id, S.sortieId);
  if (S.bilanSort === "pts") rows.sort((a, b) => (noteOf(b) ?? -1) - (noteOf(a) ?? -1) || tot(b.id) - tot(a.id));
  if (S.bilanSort === "neg") rows.sort((a, b) => (noteOf(a) ?? 99) - (noteOf(b) ?? 99) || tot(a.id) - tot(b.id));
  const byProf = {}; evs.forEach(e => byProf[e.prof] = (byProf[e.prof] || 0) + 1);
  const nP = notes.filter(e => e.pts > 0).length;
  const vals = el.map(noteOf).filter(v => v != null);
  const moyC = (year ? ss.some(sortieFaite) : true) && vals.length ? f20(Math.round(vals.reduce((a, b) => a + b, 0) / vals.length * 10) / 10) : "–";
  const n = S.settings.note20 || DEFAULT_SETTINGS.note20;
  const cols = year ? ss.map((s, i) => `<th>S${i + 1}</th>`).join("") + "<th>Moy.</th>" : "<th>+</th><th>−</th><th>Pts</th><th>/20</th>";
  return `<div class="seg" style="margin-top:0"><button class="${!year ? "on" : ""}" data-a="scope" data-v="sortie">Cette sortie</button><button class="${year ? "on" : ""}" data-a="scope" data-v="annee">Année (3 sorties)</button></div>
  <div class="stats"><div class="stat okc"><b>${nP}</b>bonus</div><div class="stat koc"><b>${notes.length - nP}</b>malus</div><div class="stat"><b>${moyC}</b>moyenne /20</div></div>
  <p class="mut" style="margin:0 2px 8px">Note /20 = ${n.base} ${n.coef === 1 ? "+ points" : `+ points × ${String(n.coef).replace(".", ",")}`}, entre 0 et 20 · ABS = absent à l'aller${year ? " · moyenne des sorties passées" : ""}</p>
  ${Object.keys(byProf).length ? `<p class="mut" style="margin:0 2px 10px">Notes par : ${Object.entries(byProf).sort((a, b) => b[1] - a[1]).map(([p, n]) => `${esc(p)} (${n})`).join(" · ")}</p>` : ""}
  <div class="seg" style="margin:0 0 10px"><button class="${S.bilanSort === "nom" ? "on" : ""}" data-a="sort" data-v="nom">A → Z</button><button class="${S.bilanSort === "pts" ? "on" : ""}" data-a="sort" data-v="pts">Meilleures notes</button><button class="${S.bilanSort === "neg" ? "on" : ""}" data-a="sort" data-v="neg">À surveiller</button></div>
  <div class="card" style="padding:6px 10px"><table class="btbl"><thead><tr><th>Élève</th>${cols}</tr></thead><tbody>
  ${rows.map(e => {
    const s = sm[e.id], t = tot(e.id);
    const abs = !year && appelRec(S.sortieId, "aller", e.id)?.statut === "absent";
    const nums = year ? ss.map(x => { if (!sortieFaite(x)) return `<td class="mut">·</td>`; const v = note20(e.id, x.id); return `<td class="${c20(v)}">${f20(v)}</td>`; }).join("")
      : `<td class="tp">${s?.plus ? "+" + s.plus : "·"}</td><td class="tm">${s?.minus ? sgn(s.minus) : "·"}</td><td class="${t > 0 ? "tp" : t < 0 ? "tm" : "mut"}">${s && s.nP + s.nM ? sgn(t) : "0"}</td>`;
    const nv = noteOf(e);
    let det = "";
    if (S.expanded === e.id) {
      const list = evs.filter(x => x.eleveId === e.id).sort((a, b) => a.ts - b.ts);
      det = `<tr class="det"><td colspan="${year ? ss.length + 2 : 5}">${list.length ? list.map(x => `<div><b class="${!isNote(x) ? "" : x.pts > 0 ? "tp" : "tm"}">${isNote(x) ? sgn(x.pts) : "💬"}</b> ${esc(x.label)} — ${esc(x.prof)}${year ? ", " + esc((ss.find(y => y.id === x.sortieId) || {}).titre || "") : ""} ${hm(x.ts)}</div>`).join("") : "Aucune note."}</td></tr>`;
    }
    return `<tr class="r" data-a="expand" data-v="${e.id}"><td>${esc(e.prenom)} <small>${esc(e.nom)}</small>${s?.nC ? " 💬" : ""}</td>${nums}<td class="t ${c20(nv)}">${year && nv == null ? "–" : f20(nv)}</td></tr>${det}`;
  }).join("")}
  </tbody></table></div>
  <div class="btns"><button class="btn" data-a="csvTot">⬇︎ Export totaux (CSV)</button><button class="btn" data-a="csvDet">⬇︎ Export détaillé (CSV)</button></div>
  <p class="mut">Les exports contiennent les deux classes et les trois sorties ; ils s'ouvrent dans Excel.</p>`;
}
function dl(name, rows) {
  const csv = "﻿" + rows.map(r => r.map(c => { c = String(c ?? ""); return /[;"\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function csvTot() {
  const ss = S.settings.sorties, num = v => v == null ? "ABS" : String(v).replace(".", ",");
  const rows = [["Classe", "Nom", "Prénom", ...ss.flatMap((s, i) => [`S${i + 1} ${s.titre} (points)`, `S${i + 1} ${s.titre} (/20)`]), "Moyenne /20", "Nb bonus", "Nb malus", "Nb commentaires", "Absences (aller)"]];
  const sm = scoreMap(() => true);
  classList().forEach(cl => eleves(cl).forEach(e => {
    const s = sm[e.id];
    rows.push([cl, e.nom, e.prenom, ...ss.flatMap(x => sortieFaite(x) ? [s?.bySortie[x.id] || 0, num(note20(e.id, x.id))] : ["", ""]), moyenne(e.id) == null ? "" : num(moyenne(e.id)), s?.nP || 0, s?.nM || 0, s?.nC || 0, ss.filter(x => appelRec(x.id, "aller", e.id)?.statut === "absent").length]);
  }));
  dl("bilan_totaux_cinema_6e.csv", rows);
}
function csvDet() {
  const ss = S.settings.sorties, rows = [["Sortie", "Date", "Classe", "Nom", "Prénom", "Action", "Points", "Enseignant", "Heure"]];
  const order = Object.fromEntries(ss.map((s, i) => [s.id, i]));
  [...S.events].sort((a, b) => (order[a.sortieId] - order[b.sortieId]) || a.classe.localeCompare(b.classe) || (a.nom || "").localeCompare(b.nom || "") || a.ts - b.ts)
    .forEach(e => { const s = ss.find(x => x.id === e.sortieId) || {}; const el = eleveById(e.eleveId) || e; rows.push([s.titre, s.date, e.classe, el.nom, el.prenom, isNote(e) ? e.label : "Commentaire : " + e.label, isNote(e) ? e.pts : "", e.prof, hm(e.ts)]); });
  dl("bilan_detail_cinema_6e.csv", rows);
}

/* ---- Réglages ---- */
function vReglages() {
  const r = isRef(), dis = r ? "" : "disabled", st = S.settings;

  const profs = [...S.profs].sort((a, b) => b.ts - a.ts);
  const aRow = a => `<div class="arow"><input data-c="aLabel" data-v="${a.id}" value="${esc(a.label)}" ${dis}>
    <div class="step"><button data-a="aPts" data-v="${a.id}|-1" ${dis}>−</button><b class="${a.type === "+" ? "tp" : "tm"}">${a.pts}</b><button data-a="aPts" data-v="${a.id}|1" ${dis}>+</button></div>
    ${r ? `<button class="del" data-a="aDel" data-v="${a.id}" aria-label="Supprimer">🗑</button>` : ""}</div>`;
  return `
  <section class="card"><h3>Mon profil</h3>
    <p style="margin:0 0 4px"><b style="font-size:17px">${esc(S.me.prenom)}</b> ${r ? "· référent ⭐" : ""}</p>
    <p class="mut" style="margin:0">${DEMO ? "Mode démo : les données restent sur cet appareil." : "Espace partagé : " + esc(S.me.code.slice(0, 3)) + "•••••"}</p>
    <div class="btns"><button class="btn acc" data-a="share">📤 Inviter un collègue</button><button class="btn" data-a="logout">Changer de prénom</button></div>
  </section>
  <section class="card"><h3>Enseignants connectés</h3>
    ${profs.length ? `<div class="pchips">${profs.map(p => `<span class="pchip ${new Date(p.ts).toDateString() === today ? "now" : ""}">${esc(p.prenom)}${norm(p.prenom) === norm(st.referent) ? " ⭐" : ""} <span class="mut">${new Date(p.ts).toDateString() === today ? hm(p.ts) : fmtD(new Date(p.ts).toISOString().slice(0, 10))}</span></span>`).join("")}</div>` : `<p class="mut">Personne pour l'instant.</p>`}
    <p class="mut" style="margin-bottom:0">Contour vert = connecté aujourd'hui.</p>
  </section>
  <section class="card"><h3>Barème des actions</h3>
    ${r ? `<p class="mut" style="margin-top:0">Les modifications s'appliquent aux prochaines notes. Les notes déjà données gardent leurs points.</p>` : `<p class="warn">Seul le référent (${esc(st.referent)}) peut modifier le barème.</p>`}
    <h4 class="tp">Bonus</h4>${st.actions.filter(a => a.type === "+").map(aRow).join("")}
    ${r ? `<button class="btn sm" data-a="aAdd" data-v="+">+ Ajouter un bonus</button>` : ""}
    <h4 class="tm">Malus</h4>${st.actions.filter(a => a.type === "-").map(aRow).join("")}
    ${r ? `<button class="btn sm" data-a="aAdd" data-v="-">+ Ajouter un malus</button>
    <div class="btns"><button class="btn danger sm" data-a="aReset">Rétablir le barème par défaut</button></div>` : ""}
  </section>
  <section class="card"><h3>Note sur 20 (par sortie)</h3>
    <div class="arow"><span style="flex:1">Note de départ</span><div class="step"><button data-a="n20" data-v="base|-1" ${dis}>−</button><b>${st.note20.base}</b><button data-a="n20" data-v="base|1" ${dis}>+</button></div></div>
    <div class="arow"><span style="flex:1">Valeur d'un point</span><div class="step"><button data-a="n20" data-v="coef|-1" ${dis}>−</button><b>${String(st.note20.coef).replace(".", ",")}</b><button data-a="n20" data-v="coef|1" ${dis}>+</button></div></div>
    <p class="mut" style="margin-bottom:0">Note = ${st.note20.base} + points × ${String(st.note20.coef).replace(".", ",")}, entre 0 et 20. Exemple : un élève avec un malus −2 et un bonus +1 obtient ${f20(Math.max(0, Math.min(20, st.note20.base - st.note20.coef)))}/20. Un élève absent n'a pas de note.</p>
  </section>
  <section class="card"><h3>Les 3 sorties</h3>
    ${st.sorties.map((s, i) => `<div class="frow"><span>${i + 1}</span><input data-c="sTitre" data-v="${i}" value="${esc(s.titre)}" ${dis}><input type="date" data-c="sDate" data-v="${i}" value="${esc(s.date)}" ${dis}></div>`).join("")}
  </section>
  <section class="card"><h3>Listes de classe</h3>
    ${classList().length ? classList().map(c => `<div class="frow" style="justify-content:space-between"><span style="width:auto;color:var(--tx)">${esc(c)}</span><span class="mut" style="flex:1;font-weight:400">${eleves(c).length} élèves</span>${r ? `<button class="btn sm danger" style="margin:0" data-a="clsDel" data-v="${esc(c)}">Supprimer</button>` : ""}</div>`).join("") : `<p class="mut">Aucune classe importée.</p>`}
    ${r ? `<h4>Importer / remplacer une liste</h4>
      <p class="mut" style="margin-top:0">Copiez les colonnes <b>Nom</b> et <b>Prénom</b> depuis Excel et collez-les ci-dessous (une ligne par élève), ou choisissez le fichier CSV exporté.</p>
      <div class="frow"><input id="impC" data-in="impC" placeholder="Classe (ex. 6A)" value="${esc(S.impC)}" style="flex:0 0 120px"><input type="file" id="impF" accept=".csv,.txt,text/csv,text/plain" style="flex:1;font-size:12px"></div>
      <textarea id="impT" data-in="impT" rows="5" placeholder="ALIOUAT&#9;Léhana&#10;AUDIC&#9;Valentine&#10;…">${esc(S.impT)}</textarea>
      <div class="btns"><button class="btn acc" data-a="import">Importer la liste</button></div>` : ""}
  </section>
  <section class="card"><h3>Enseignant référent</h3>
    <input data-c="ref" value="${esc(st.referent)}" ${dis}>
    <p class="mut" style="margin-bottom:0">Le référent peut modifier le barème, les sorties, les listes, et supprimer n'importe quelle note.</p>
  </section>
  ${DEMO ? `<section class="card"><h3>Démo</h3><button class="btn danger" data-a="demoReset">Effacer toutes les données de démo</button></section>` : ""}
  <p class="mut" style="text-align:center">Échappées · Collège au cinéma 2026-2027</p>`;
}
function saveSettings() { S.store.set("config", "settings", { referent: S.settings.referent, note20: S.settings.note20, sorties: S.settings.sorties, actions: S.settings.actions }); }

function parseList(txt) {
  const out = [];
  txt.split(/\r?\n/).forEach((line, i) => {
    line = line.trim(); if (!line) return;
    let cells = line.split(/\t|;|,/).map(c => c.replace(/^"|"$/g, "").trim()).filter(Boolean);
    if (i === 0 && cells.length && norm(cells[0]) === "nom") return;
    let nom, prenom;
    if (cells.length >= 2) { [nom, prenom] = cells; }
    else {
      const t = line.split(/\s+/); const k = t.findIndex(w => w !== w.toUpperCase());
      if (k <= 0) return; nom = t.slice(0, k).join(" "); prenom = t.slice(k).join(" ");
    }
    if (!nom || !prenom) return;
    nom = nom.toUpperCase();
    out.push({ nom, prenom });
  });
  return out;
}
async function doImport() {
  if (!isRef()) return;
  const cl = (S.impC || "").trim().toUpperCase();
  if (!cl) return toast("Indiquez le nom de la classe (ex. 6A).");
  const list = parseList(S.impT || "");
  if (!list.length) return toast("Aucun élève reconnu dans le texte collé.");
  if (!await ask(`${S.classes[cl] ? "Remplacer" : "Créer"} la classe ${cl} avec ${list.length} élèves ?\n\nPremier : ${list[0].nom} ${list[0].prenom}\nDernier : ${list[list.length - 1].nom} ${list[list.length - 1].prenom}`)) return;
  const el = list.sort((a, b) => a.nom.localeCompare(b.nom)).map(e => ({ id: cl + "_" + slug(e.nom + "-" + e.prenom), ...e }));
  S.store.set("classes", cl, { eleves: el });
  S.impC = ""; S.impT = ""; S.classe = cl;
  toast(`✓ ${cl} importée (${el.length} élèves)`);
}
async function share() {
  const url = location.origin + location.pathname + (DEMO ? "" : "#k=" + encodeURIComponent(S.me.code));
  const text = "Sortie cinéma 6e : ouvre ce lien et entre simplement ton prénom pour noter les élèves et faire l'appel.";
  try { if (navigator.share) { await navigator.share({ title: "Échappées · Sorties cinéma", text, url }); return; } } catch (e) { if (e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text + "\n" + url); toast("Lien copié ✓ — collez-le dans un SMS ou un mail"); }
  catch (e) { await askText("Copiez ce lien et envoyez-le :", url); }
}

/* ------------------- fenêtres de confirmation intégrées ------------------- */
function dialog(msg, withInput, def) {
  return new Promise(res => {
    const d = $("#dlg");
    d.innerHTML = `<div class="dbox"><p>${esc(msg).replace(/\n/g, "<br>")}</p>${withInput ? `<input id="dlgIn" value="${esc(def || "")}">` : ""}
      <div class="btns" style="justify-content:flex-end"><button class="btn" id="dlgNo">Annuler</button><button class="btn acc" id="dlgOk">OK</button></div></div>`;
    d.classList.add("open");
    const inp = $("#dlgIn"); if (inp) { inp.focus(); inp.select(); }
    const end = v => { d.classList.remove("open"); d.innerHTML = ""; res(v); };
    $("#dlgNo").onclick = () => end(withInput ? null : false);
    $("#dlgOk").onclick = () => end(withInput ? $("#dlgIn").value : true);
    if (inp) inp.onkeydown = e => { if (e.key === "Enter") end(inp.value); };
  });
}
const ask = msg => dialog(msg, false);
const askText = (msg, def) => dialog(msg, true, def);

/* ------------------------------- toast --------------------------------- */
let tT;
function toast(msg, btnLabel, fn) {
  const t = $("#toast"); $("#tmsg").textContent = msg;
  const b = $("#tbtn"); b.textContent = btnLabel || ""; b.style.display = btnLabel ? "" : "none";
  b.onclick = () => { t.classList.remove("show"); fn && fn(); };
  t.classList.add("show"); clearTimeout(tT); tT = setTimeout(() => t.classList.remove("show"), btnLabel ? 5000 : 2600);
}

/* ---------------------------- interactions ----------------------------- */
const H = {
  tab: v => { S.tab = v; S.expanded = null; render(); scrollTo(0, 0); },
  sortie: v => { S.sortieId = v; presence(); render(); },
  classe: v => { S.classe = v; LS.set("cac_classe", v); S.expanded = null; render(); },
  eleve: v => openSheet(v),
  act: v => record(v),
  comment: () => addComment(),
  n20: v => { if (!isRef()) return; const [k, d] = v.split("|"); const n = S.settings.note20 = { ...DEFAULT_SETTINGS.note20, ...S.settings.note20 };
    if (k === "base") n.base = Math.min(20, Math.max(0, n.base + +d));
    else { const steps = [0.25, 0.5, 1, 1.5, 2, 3]; const i = Math.max(0, steps.indexOf(n.coef)); n.coef = steps[Math.min(steps.length - 1, Math.max(0, i + +d))]; }
    saveSettings(); render(); },
  closeSheet: () => closeSheet(),
  delEv: async v => { if (await ask("Supprimer cette note ?")) S.store.del("events", v); },
  cp: v => { S.checkpoint = v; render(); },
  appel: v => setAppel(v),
  onlyLeft: () => { S.onlyLeft = !S.onlyLeft; render(); },
  scope: v => { S.bilanScope = v; S.expanded = null; render(); },
  sort: v => { S.bilanSort = v; render(); },
  expand: v => { S.expanded = S.expanded === v ? null : v; render(); },
  csvTot, csvDet, share, import: doImport,
  logout: async () => { if (await ask("Changer de prénom sur ce téléphone ?")) { S.me = { code: S.me.code }; LS.set("cac_me", S.me); location.reload(); } },
  aPts: v => { if (!isRef()) return; const [id, d] = v.split("|"); const a = S.settings.actions.find(x => x.id === id); a.pts = Math.min(10, Math.max(1, a.pts + +d)); saveSettings(); render(); },
  aDel: async v => { if (!isRef()) return; const a = S.settings.actions.find(x => x.id === v); if (await ask(`Supprimer « ${a.label} » du barème ?`)) { S.settings.actions = S.settings.actions.filter(x => x.id !== v); saveSettings(); render(); } },
  aAdd: async t => { if (!isRef()) return; const label = await askText(t === "+" ? "Nouveau bonus :" : "Nouveau malus :"); if (!label || !label.trim()) return; S.settings.actions.push({ id: (t === "+" ? "b" : "m") + uid8(), type: t, label: label.trim(), pts: 1 }); saveSettings(); render(); },
  aReset: async () => { if (isRef() && await ask("Remettre le barème d'origine ?")) { S.settings.actions = clone(DEFAULT_SETTINGS.actions); saveSettings(); render(); } },
  clsDel: async v => { if (isRef() && await ask(`Supprimer la liste ${v} ? (les notes déjà données sont conservées)`)) S.store.del("classes", v); },
  demoReset: async () => { if (await ask("Effacer toutes les données de démo ?")) { S.store.reset(); location.reload(); } }
};
document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]"); if (!t || t.disabled) return;
  const f = H[t.dataset.a]; if (f) { e.preventDefault(); f(t.dataset.v, t, e); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "impF" && t.files[0]) {
    const rd = new FileReader();
    rd.onload = () => { S.impT = String(rd.result); const ta = $("#impT"); if (ta) ta.value = S.impT; const m = t.files[0].name.match(/6\s?[A-Z]/i); if (m && !S.impC) { S.impC = m[0].replace(/\s/, "").toUpperCase(); const c = $("#impC"); if (c) c.value = S.impC; } };
    rd.readAsText(t.files[0], "utf-8"); return;
  }
  const c = t.dataset.c; if (!c || !isRef()) return;
  const v = t.dataset.v, st = S.settings;
  if (c === "aLabel") { const a = st.actions.find(x => x.id === v); if (a && t.value.trim()) a.label = t.value.trim(); }
  if (c === "sTitre" && t.value.trim()) st.sorties[+v].titre = t.value.trim();
  if (c === "sDate" && t.value) st.sorties[+v].date = t.value;
  if (c === "ref" && t.value.trim()) st.referent = t.value.trim();
  saveSettings(); toast("Enregistré ✓");
});
document.addEventListener("input", e => { const k = e.target.dataset.in; if (k) S[k] = e.target.value; });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
const net = () => $("#net").classList.toggle("show", !navigator.onLine);
addEventListener("online", net); addEventListener("offline", net); net();

/* hors-ligne : met la page en cache pour pouvoir la rouvrir sans réseau */
if ("serviceWorker" in navigator && location.protocol === "https:" && !DEMO) navigator.serviceWorker.register("sw.js").catch(() => {});

/* ------------------------------ lancement ------------------------------ */
const hk = hashCode();
if (hk && S.me && S.me.code !== hk) { S.me.code = hk; LS.set("cac_me", S.me); }
if (!S.me || !S.me.prenom || (!DEMO && !S.me.code)) renderLogin(); else start();
</script>
